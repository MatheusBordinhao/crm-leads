# Ambiente de desenvolvimento. Produção fica em docker-compose.prod.yml (README › Publicação).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja o README)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A API de desenvolvimento num contêiner Linux, para o Windows que não deixa carregar as DLLs do projeto (o Controle
  # Inteligente de Aplicativos, README › Dia a dia): docker compose up -d api. Onde o dotnet run funciona, suba só o
  # banco (docker compose up -d db).
  # A configuração é a mesma do dotnet run no Windows: a própria API lê o mesmo .env (ArquivoEnv) e o
  # appsettings.Development.json. Daqui saem só a conexão com o banco, pelo nome do serviço e com a senha do .env, e a
  # pasta das chaves da sessão, num volume, para o login não cair quando o contêiner reinicia. O código entra só para
  # leitura, e o build fica num volume.
  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0.402
    working_dir: /src
    # Compila e sobe a API. Num "docker compose run", o que vier depois do nome do serviço vai para ela, como o
    # preparar-demonstracao. Pare o api antes: os dois compilam no mesmo volume.
    entrypoint:
      - sh
      - -c
      - dotnet build src/Crm.Api --artifacts-path /artefatos -v q -nologo && cd /src/src/Crm.Api && exec dotnet /artefatos/bin/Crm.Api/debug/Crm.Api.dll "$$@"
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # A mesma porta do dotnet run. A imagem do SDK vem com a 8080, como a de produção.
      ASPNETCORE_HTTP_PORTS: "5080"
      ConnectionStrings__Crm: Host=db;Port=5432;Database=crm;Username=crm;Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja o README)}
      DataProtection__Pasta: /chaves
      # Só para o log mostrar a hora de Brasília, como no Windows. As datas da aplicação não dependem do fuso.
      TZ: America/Sao_Paulo
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    ports:
      # Só no próprio computador, como o banco. O proxy do Vite (web/vite.config.ts) chega por aqui.
      - "127.0.0.1:5080:5080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/src:ro
      - nuget:/root/.nuget/packages
      - artefatos-api:/artefatos
      - chaves-sessao:/chaves

  # O dotnet ef num contêiner Linux, pelo mesmo motivo: docker compose run --rm ef migrations add <Nome>.
  # Roda na pasta da API, com a mesma configuração dela. Só a pasta das migrations aceita escrita, e o build fica num
  # volume (o ArtifactsPath, que o MSBuild lê do ambiente).
  ef:
    profiles: [ferramentas]
    image: mcr.microsoft.com/dotnet/sdk:10.0.402
    working_dir: /src/src/Crm.Api
    # O dotnet ef lê o projeto antes de compilar e precisa do restore feito no volume.
    entrypoint: [sh, -c, 'dotnet tool restore > /dev/null && dotnet restore -v q && dotnet ef "$$@"', ef]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ArtifactsPath: /artefatos
      ConnectionStrings__Crm: Host=db;Port=5432;Database=crm;Username=crm;Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja o README)}
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/src:ro
      - ./src/Crm.Api/Infra/Dados/Migrations:/src/src/Crm.Api/Infra/Dados/Migrations
      - nuget:/root/.nuget/packages
      - artefatos-ef:/artefatos

  # O n8n Community, só para desenvolvimento: monta e testa os fluxos de n8n/ com dados de teste (README › n8n local).
  # Produção vai ser o n8n Cloud, que recebe os mesmos JSONs. Ninguém depende dele: com ele parado, a API continua no ar,
  # e os eventos ficam pendentes. A API o chama em http://n8n:5678, e os fluxos chamam a API em http://api:5080.
  # A conta de dono, as credenciais e a chave que as criptografa ficam no volume, nunca aqui.
  n8n:
    image: n8nio/n8n:2.43.5
    restart: unless-stopped
    environment:
      # Os agendamentos no horário de Brasília. Os fluxos do CRM também levam o fuso nas configurações deles.
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      # Os endereços que a tela mostra e os links dos e-mails do CRM - Erros, com a porta publicada abaixo.
      WEBHOOK_URL: http://localhost:5679/
      N8N_EDITOR_BASE_URL: http://localhost:5679
      # Sem telemetria, sem a consulta de versão nova e sem o questionário do primeiro acesso.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Como no n8n Cloud: os fluxos não leem as variáveis de ambiente ($env).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports:
      # Só no próprio computador, como o banco e a API. Na 5679, e não na 5678 padrão, para não colidir com outro n8n
      # no mesmo computador. Dentro da rede do Compose, ele continua na 5678.
      - "127.0.0.1:5679:5678"
    volumes:
      - dados-n8n:/home/node/.n8n

volumes:
  dados-postgres:
  nuget:
  artefatos-api:
  artefatos-ef:
  chaves-sessao:
  dados-n8n:
